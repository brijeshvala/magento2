version: "3.8"

services:
  varnish:
    image: varnish:fresh
    container_name: app_varnish
    ports:
      - "80:80"
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
      - ./varnish/secret:/etc/varnish/secret:ro
    tmpfs:
      - /var/lib/varnish/varnishd:exec
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      memlock:
        soft: 85983232
        hard: 85983232
    command: >
      varnishd -F
      -a :80
      -f /etc/varnish/default.vcl
      -S /etc/varnish/secret
      -s malloc,256m
      -p workspace_backend=256k
      -p workspace_client=256k
      -p http_resp_hdr_len=65536
      -p http_resp_size=98304
      -p feature=+http2
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: app_nginx
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
      - NGINX_DISABLE_IPV6=1
    ports:
      - "443:443"
    volumes:
      - ./html:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --header='Host: test.mgt.com' -q --spider http://127.0.0.1:8081/health_check.php || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - php
    networks:
      - app-network

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: app_php
    volumes:
      - ./html:/var/www/html
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: app_mysql
    restart: always
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: Qwert@1234
      MYSQL_DATABASE: magento
      MYSQL_USER: magento_user
      MYSQL_PASSWORD: Qwert@1234
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: magento_elasticsearch
    restart: always
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "xpack.security.enabled=false"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: app_pma
    restart: always
    environment:
      PMA_HOST: app_mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    depends_on:
      - mysql
    networks:
      - app-network    

  redis:
    image: redis:7-alpine
    container_name: redis_server
    restart: always
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "Qwert@1234"]
    networks:
      - app-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_admin
    restart: always
    environment:
      - PORT=8082
      - REDIS_HOSTS=server:redis_server:6379:0:Qwert@1234,cache:redis_cache:6379:0:Qwert@1234,session:redis_session:6379:0:Qwert@1234
      - HTTP_USER=admin
      - HTTP_PASSWORD=Qwert@1234
      - URL_PREFIX=/redis-admin
      - TRUST_PROXY=1
    depends_on:
      - redis
      - redis_cache
      - redis_session
    networks:
      - app-network

  # Redis for Magento Cache (Default & Page Cache)
  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass "Qwert@1234"
    volumes:
      - redis_cache_data:/data
    networks:
      - app-network

  # Redis for Magento Sessions
  redis_session:
    image: redis:7-alpine
    container_name: redis_session
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --requirepass "Qwert@1234"
    volumes:
      - redis_session_data:/data
    networks:
      - app-network
  
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: app_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-network
      
  cadvisor:
    image: gcr.io/cadvisor/cadvisor-amd64:v0.49.1
    container_name: app_cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
      - '--disable_root_cgroup_stats=true'
      - '--raw_cgroup_prefix_whitelist=/docker/'
      - '--disable_metrics=disk,diskIO,tcp,udp,percpu,process,sched,hugetlb,referenced_memory'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:10.2.3
    container_name: app_grafana
    environment:
      - GF_SERVER_ROOT_URL=https://test.mgt.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ENFORCE_DOMAIN=false
    networks:
      - app-network

  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: app_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  es_data:
  redis_data:
  redis_cache_data:
  redis_session_data:
  prometheus_data:  
  grafana_data: